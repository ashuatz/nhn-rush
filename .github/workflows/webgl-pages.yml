name: WebGL Pages

# v로 시작하는 태그를 푸시하면 WebGL 빌드를 만들어 GitHub Pages에 올린다.
# 예: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 배포는 겹치면 안 된다. 진행 중인 배포는 끝까지 두고 새 요청만 대기시킨다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Unity 에디터 도커 이미지가 7GB 이상이라 러너 기본 여유 공간으로는 빠듯하다.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.20f1
          targetPlatform: WebGL
          buildMethod: Rush.EditorTools.WebGLBuildPipeline.BuildForPages
          buildsPath: build
          buildName: WebGL
          versioning: Custom
          version: ${{ github.ref_name }}
          allowDirtyBuild: true

      - name: Prepare artifact
        run: |
          # 컨테이너가 root로 만든 산출물이라 러너 계정으로 소유권을 되돌린다.
          sudo chown -R "$USER":"$USER" build
          # Pages의 Jekyll 처리를 끈다.
          touch build/WebGL/WebGL/.nojekyll
          ls -la build/WebGL/WebGL

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
