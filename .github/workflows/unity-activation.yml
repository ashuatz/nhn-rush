name: Unity Activation File

# UNITY_LICENSE 시크릿용 .ulf를 발급받을 때 1회만 수동 실행한다.
# Unity 6 + Hub 3.x는 로컬에 .ulf를 만들지 않으므로(UnityEntitlementLicense.xml만 생김)
# Personal 라이선스는 이 경로로 .alf를 받아 수동 활성화해야 한다.
# 실행하면 .alf 파일이 아티팩트로 나온다. 자세한 절차는 Docs/CICD_웹빌드_배포.md 참고.
on:
  workflow_dispatch:

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request
        id: request
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.20f1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.request.outputs.filePath }}
          path: ${{ steps.request.outputs.filePath }}
